name: CI/CD Pipeline for Agent components
on:
  pull_request:
    branches:
      - stage
    paths-ignore:
      - 'README.md'
      - 'sam-econolens-agent-docs.md'
      - 'sam-econolens-pipeline-docs.md'
      - 'assets/**'
  # push: # On approval of pull request, no need to run test again. Requires spin up/down of infrastructure
  #   branches:
  #     - stage
run-name: ${{ github.actor }} is running a test on the ${{ github.ref }} branch
jobs:
  build-agent-infra-and-test-agent:
    runs-on: ubuntu-latest
    steps:
      # Setting up GActions environment: Clone, Python, SAM Cli, AWS auth
      - uses: actions/checkout@v5
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner and is ready to run."
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/test_requirements.txt
      - name: Check pip
        run: pip check
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      # Spin up infrastructure on AWS
      - name: Build stack
        working-directory: sam-econolens-agent
        run: sam build
      - name: Depoy stack
        working-directory: sam-econolens-agent
        run: sam deploy --config-env "stage" --no-confirm-changeset --no-fail-on-empty-changeset

      # Run tests on AI Agent
        # Get variables
      - name: Acquire AgentID and AgentAliasID from cloudF output
        run: |
          agent_id="$(aws cloudformation describe-stacks --stack-name sam-econolens-agent-stg --query "Stacks[0].Outputs[?OutputKey=='AgentID'].OutputValue" --output text)"

          echo "AGENT_ID=$agent_id" >> $GITHUB_ENV

          agent_alias_id="$(aws cloudformation describe-stacks --stack-name sam-econolens-agent-stg --query "Stacks[0].Outputs[?OutputKey=='AgentAliasID'].OutputValue" --output text)"

          echo "AGENT_ALIAS_ID=$agent_alias_id" >> $GITHUB_ENV

      - name: Smoke tests
        run: |
          pytest tests/smoke/test_smoke.py
        env:
          AGENT_ID: ${{ env.AGENT_ID }}
          AGENT_ALIAS_ID: ${{ env.AGENT_ALIAS_ID }}
      - name: Unit tests
        run: |
          pytest tests/unit/test_unit.py
        env:
          AGENT_ID: ${{ env.AGENT_ID }}
          AGENT_ALIAS_ID: ${{ env.AGENT_ALIAS_ID }}

      # Clean up resources
      - name: Clean up stack
        working-directory: sam-econolens-agent
        run: sam delete --stack-name sam-econolens-agent-stg --no-prompts