AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  python3.11
  Built with SAM Template build-with-image for sam-econolens

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 60 # Seconds
    Environment:
      Variables:
        S3_SOURCE: econolens-staging-area
        S3_DESTINATION: econolens-data-enriched

Resources:
  APICallFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Role: arn:aws:iam::975373241930:role/EconolensAPICALLANDSTOREAccess
      
      # Events:
      #   HelloWorld:
      #     Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
      #     Properties:
      #       Path: /hello
      #       Method: get
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./functions/pipeline_1_api_call
      DockerTag: python3.11-v1
    
  DataEnrichmentFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Role: arn:aws:iam::975373241930:role/EconolensDATAENRICHMENTAccess
      # Environment:
      #   Variables:
      #     NLTK_DATA: /root/nltk_data
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./functions/pipeline_2_data_enrichment
      DockerTag: python3.11-v1

