AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  python3.11
  Built with SAM Template build-with-image deployment package for sam-econolens

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 300 # seconds
    Environment:
      Variables:
        S3_SOURCE: econolens-staging-area
        S3_DESTINATION: econolens-data-enriched
        BEDROCK_KB_ID: J689XHGM6B
        BEDROCK_KB_DATASOURCE_ID: SVQMEHRJIE

Resources:
  # IAM roles created with AWS managed IAM policies
  EconolensAPICALLANDSTORERole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
  
  EconolensDATAENRICHMENTRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  EconolensKBSYNCRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: "sts:AssumeRole"
      # https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-prereq-permissions-general.html
      Policies:
        - PolicyName: BedrockKBManagementPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:GetKnowledgeBase
                  - bedrock:ListKnowledgeBases
                  - bedrock:UpdateKnowledgeBase
                  - bedrock:DeleteKnowledgeBase
                  - bedrock:StartIngestionJob
                  - bedrock:GetIngestionJob
                  - bedrock:ListIngestionJobs
                  - bedrock:StopIngestionJob
                  - bedrock:TagResource
                  - bedrock:UntagResource
                Resource: '*' 

  # Infrastructure
  NewsPipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/news_pipeline.asl.json
      DefinitionSubstitutions:
        APICallFunctionArn: !GetAtt APICallFunction.Arn
        DataEnrichmentFunctionArn: !GetAtt DataEnrichmentFunction.Arn
        BedrockKBIngestFunctionArn: !GetAtt BedrockKBIngestFunction.Arn
      # Run at 10 am everyday. Use contexte data from EB scheduler not SF
      # https://docs.aws.amazon.com/step-functions/latest/dg/input-output-contextobject.html#contextobject-format
      # https://docs.aws.amazon.com/scheduler/latest/UserGuide/managing-schedule-context-attributes.html
      Events:
        DailyTrigger:
          Type: ScheduleV2
          Properties:
            Name: DailyTrigger
            Description: "Run the data pipeline every day at 10 AM Pacific Time"
            ScheduleExpression: "cron(0 10 * * ? *)"
            ScheduleExpressionTimezone: "America/Los_Angeles"
            Input: '{"batch_date": "<aws.scheduler.scheduled-time>"}'
      # SAM policy templates: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-policy-templates.html
      Policies: 
        - LambdaInvokePolicy:
            FunctionName: !Ref APICallFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref DataEnrichmentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref BedrockKBIngestFunction

  APICallFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Role: !GetAtt EconolensAPICALLANDSTORERole.Arn
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./functions/pipeline_1_api_call
      DockerTag: python3.11-v1
    
  DataEnrichmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Role: !GetAtt EconolensDATAENRICHMENTRole.Arn
      # increasedfor loading en_core_web_sm model. default is 128 MB https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html#configuration-memory-use-cases 
      MemorySize: 512
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./functions/pipeline_2_data_enrichment
      DockerTag: python3.11-v1

  BedrockKBIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Role: !GetAtt EconolensKBSYNCRole.Arn
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./functions/pipeline_3_bedrockKB_ingest
      DockerTag: python3.11-v1
  
Outputs:
  APICallFunctionArn:
    Description: ARN of the API Call Lambda function
    Value: !GetAtt APICallFunction.Arn

  DataEnrichmentFunctionArn:
    Description: ARN of the Data Enrichment Lambda function
    Value: !GetAtt DataEnrichmentFunction.Arn

  BedrockKBIngestFunctionArn:
    Description: ARN of the Bedrock KB Ingest Lambda function
    Value: !GetAtt BedrockKBIngestFunction.Arn

  EconolensAPICALLANDSTORERoleArn:
    Description: ARN of the API Call Lambda Role
    Value: !GetAtt EconolensAPICALLANDSTORERole.Arn

  EconolensDATAENRICHMENTRoleArn:
    Description: ARN of the Data Enrichment Lambda Role
    Value: !GetAtt EconolensDATAENRICHMENTRole.Arn

  EconolensKBSYNCRoleArn:
    Description: ARN of the Bedrock KB Sync Lambda Role
    Value: !GetAtt EconolensKBSYNCRole.Arn

