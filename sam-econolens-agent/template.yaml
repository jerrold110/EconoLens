  RetrieveQueryOnly:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "RetrieveQueryOnly-${Environment}"
      Role: !GetAtt AgentFunctionsRole.Arn
      CodeUri: lambda/retrieve_query_only/
      Handler: app.lambda_handler
      PackageType: Zip
      # Layers:
      #   - !Ref ModelLayer
  AgentFunctionsForRetrieveQueryOnly:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub "RetrieveQueryOnly-${Environment}"
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      #SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt BedrockAgent.AgentArn

  

  # --- IAM ROLES ---
  # Environment parameter not needed as name is uniquely assigned my CloudForm
  # Principal, who is allowed to assume the role. Resource, specific resource(s) the role (role actions) applies to
  AgentFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: A role for Agent Lambda functions to assume
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
            #Resource: !GetAtt BedrockAgent.AgentArn
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess

  BedrockAgentExecutionRole:
    # Agent does not need to access Bedrock KB directly, only action groups
    Type: AWS::IAM::Role
    Properties:
      Description: A role for Agent to assume
      # Only bedrock can assume this role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        # Theoretically: This Resource Policy allows bedrock to invoke the lambdas listed, not necessary, but more secure
        # Attach individual lambdas Arns
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                - !GetAtt RetrieveTopicCorporate.Arn
        - PolicyName: BedrockModelAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:ApplyGuardrail"
                  - "bedrock:List*"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "bedrock:GetAgentVersion"
                  - "bedrock:GetAgentAlias"
                  - "bedrock:GetAgentMemory"
                  - "bedrock:GetAgent"
                  - "bedrock:GetAgentActionGroup"
                  - "bedrock:GetAgentKnowledgeBase"
                  - "bedrock:ListAgentVersions"
                  - "bedrock:ListAgentActionGroups"
                  - "bedrock:ListAgentKnowledgeBases"
                  - "bedrock:ListAgentAliases"
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/${AgentName}" # this has to be used instead of !GetAtt BedrockAgent.AgentArn
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                  - "bedrock:InvokeModelWithResponseStream"
                  - "bedrock:GetInferenceProfile"
                  - "bedrock:GetFoundationModel"
                Resource: "*" # can place specific model arn here
              - Effect: Allow
                Action:
                  - "bedrock:GetGuardrail"
                  - "bedrock:ApplyGuardrail"
                  - "bedrock:ListGuardrails"
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/${AgentName}" # this has to be used instead of !GetAtt BedrockAgent.AgentArn
        - PolicyName: BedrockAgentObservabilityPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # This is for Bedrock model invication logging - S3 bucket only - no CloudWatch logs
              # - Effect: Allow
              #   Action:
              #     - "logs:CreateLogGroup"
              #     - "logs:CreateLogStream"
              #     - "logs:PutLogEvents"
              #   Resource: "*"
              # This is for CloudWatch Logs Metric logging
              - Effect: Allow
                Action: 
                  - "cloudwatch:PutMetricData"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: "AWS/Bedrock/Agents"
                Resource: "*"
              

  # --- Resources for logging ---
  # Taken from https://github.com/aws-samples/enable-bedrock-logging-using-cloudformation/blob/main/enable-bedrock-logging-using-cloudformation.yaml#L66
  # Server access. No encryption
  rServerAccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "econolens-server-access-logs-${Environment}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
    UpdateReplacePolicy: Retain
    # Set to delete for this project
    DeletionPolicy: Delete

  rServerAccessLogsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref rServerAccessLogsBucket
      PolicyDocument:
        Statement:
          # Deny all access if not using HTTPS
          - Action: s3:*
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
            Effect: Deny
            Principal:
              AWS: '*'
            Resource:
              - !GetAtt rServerAccessLogsBucket.Arn
              - !Sub ${rServerAccessLogsBucket.Arn}/*     
          # Can write to ServerAccessLogsBucket/bedrock-invocation-logs-bucket
          - Action: s3:PutObject
            Condition:
              ArnLike:
                aws:SourceArn: !GetAtt rBedrockInvocationLogsBucket.Arn
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Resource:
              - !Sub ${rServerAccessLogsBucket.Arn}/bedrock-invocation-logs-bucket/*
        Version: '2012-10-17'
  # Model invocation logging bucket. No encryption

  rBedrockInvocationLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "econolens-invocation-logs-${Environment}"
      LoggingConfiguration: #??
        DestinationBucketName: !Ref rServerAccessLogsBucket
        LogFilePrefix: bedrock-invocation-logs-bucket/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
    UpdateReplacePolicy: Retain
    # Set to delete for this project
    DeletionPolicy: Delete

  rBedrockInvocationLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref rBedrockInvocationLogsBucket
      PolicyDocument:
        Statement:
          - Action: s3:*
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
            Effect: Deny
            Principal:
              AWS: '*'
            Resource:
              - !GetAtt rBedrockInvocationLogsBucket.Arn
              - !Sub ${rBedrockInvocationLogsBucket.Arn}/*
          # Can write to BedrockInvocationLogsBucket
          - Action: s3:PutObject
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*
            Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Resource: !Sub ${rBedrockInvocationLogsBucket.Arn}/*
        Version: '2012-10-17'

  rBedrockLoggingLambdaFunction:
    Type: 'AWS::Lambda::Function'
    Properties:
      FunctionName: !Sub "rBedrockLoggingLambdaFunction-${Environment}"
      Runtime: 'python3.13'
      Handler: 'index.lambda_handler'
      Role: !GetAtt rBedrockLoggingLambdaExecutionRole.Arn
      Code:
        ZipFile: |
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: MIT-0

          from __future__ import print_function
          import json
          import boto3
          import urllib3
          import os
          SUCCESS = "SUCCESS"
          FAILED = "FAILED"
          http = urllib3.PoolManager()


          def lambda_handler(event, context):
              print("Received event: " + json.dumps(event))
              try:
                  s3_bucket_name = os.environ['S3_BUCKET_NAME']
                  request_type = event['RequestType']
                  bedrock_logging(s3_bucket_name,request_type,event,context)
              except Exception as e:
                  print(f"Error: {e}")
                  responseData = {'message': 'Operation Failed'}
                  send(event, context, FAILED, responseData)
                  
              
          def bedrock_logging(s3_bucket_name,request_type,event,context):
              client = boto3.client('bedrock')
              if request_type == 'Create' or request_type == 'Update':
                  response = client.put_model_invocation_logging_configuration(
                      loggingConfig={
                          's3Config': {
                              'bucketName': s3_bucket_name,
                              'keyPrefix': 'bedrock'
                          },
                          'textDataDeliveryEnabled': True,
                          'imageDataDeliveryEnabled': False,
                          'embeddingDataDeliveryEnabled': False
                      }
                  )
                  message = 'Operation to enable or update Bedrock logging succeeded'
              elif request_type == 'Delete':
                  response = client.delete_model_invocation_logging_configuration()
                  message = 'Operation to disable Bedrock logging succeeded'
              else:
                  send(event, context, FAILED, {'message': f'Unsupported request type: {request_type}'})
                  return
              status = SUCCESS if response['ResponseMetadata']['HTTPStatusCode'] == 200 else FAILED
              send(event, context, status, {'message': message})


          def send(event, context, responseStatus, responseData, physicalResourceId=None, noEcho=False, reason=None):
              responseUrl = event['ResponseURL']
              print(responseUrl)
              responseBody = {
                  'Status' : responseStatus,
                  'Reason' : reason or "See the details in CloudWatch Log Stream: {}".format(context.log_stream_name),
                  'PhysicalResourceId' : physicalResourceId or context.log_stream_name,
                  'StackId' : event['StackId'],
                  'RequestId' : event['RequestId'],
                  'LogicalResourceId' : event['LogicalResourceId'],
                  'NoEcho' : noEcho,
                  'Data' : responseData
              }
              json_responseBody = json.dumps(responseBody)
              print("Response body:")
              print(json_responseBody)
              headers = {
                  'content-type' : '',
                  'content-length' : str(len(json_responseBody))
              }
              try:
                  response = http.request('PUT', responseUrl, headers=headers, body=json_responseBody)
                  print("Status code:", response.status)
              except Exception as e:
                  print("send(..) failed executing http.request(..):", e)
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref rBedrockInvocationLogsBucket

  rBedrockLoggingLambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: BedrockLoggingInlinePolicy
          PolicyDocument:
            Statement:
              - Action:
                  - bedrock:DeleteModelInvocationLoggingConfiguration
                  - bedrock:PutModelInvocationLoggingConfiguration
                Effect: Allow
                Resource: '*'
              # - Action:
              #     - iam:PassRole
              #   Effect: Allow
              #   Resource: !GetAtt rBedrockServiceRoleForLogging.Arn
            Version: '2012-10-17'
          

  rInvokeLambda:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceTimeout: 60
      ServiceToken: !GetAtt rBedrockLoggingLambdaFunction.Arn

Outputs:
  AgentID:
    Description: "Bedrock Agent ID"
    Value: !GetAtt BedrockAgent.AgentId
  AgentAliasID:
    Description: "Bedrock Agent Alias ID"
    Value: !GetAtt AgentAlias.AgentAliasId