AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sam-econolens-agent
  AI components of the Econolens project consisting of IAM, Agent, Action groups & Lambdas, guardrail, Agent alias

Parameters:
  AgentName:
    Type: String
    Default: EconolensAgent
    Description: Name for the Bedrock Agent

Globals:
  Function:
    Timeout: 300 # seconds
    MemorySize: 1024 # MB
    Tracing: Active
    Runtime: python3.11
    Architectures:
      - x86_64
    Environment:
      Variables:
        BEDROCK_KNOWLEDGE_BASE_ID: TPBNZDX8VZ # Bedrock KB ID, switches every time I restart the KB
        # Max returned in 1 call is 100, more requires pagination and nextToken
        RETRIEVE_CHUNK_PER_DAY_COUNT: 5 
        RERANK_CHUNK_COUNT: 100 # and number of returned chunks
# https://repost.aws/questions/QUwyrhlEugTH-DV_dH5lG3Ag/issue-with-bedrock-agents-and-lambda-function-model-timeout-error
Resources:
  # --- BEDROCK AGENT ---
  BedrockAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Ref AgentName # this is working
      AgentResourceRoleArn: !GetAtt BedrockAgentExecutionRole.Arn
      Description: "Agent for economic reporting and question answering. Required: Time-period dates (inclusive). Optional: Topic, entity keyword"
      # https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html
      FoundationModel: amazon.nova-pro-v1:0
      
      # ---Instructions ---
      Instruction: |
        You are an economic analyst that generates economic reports and answers specific questions about economic events, in the American economy. You access current data through action group tools containing news articles up to the present day.
        You must answer ONLY using information retrieved from the action group tools. If the retrieved data does not contain any information, reply: "I don't have enough information to answer that." Do NOT use details from the previous response as facts to respond with.

        Fundamental Rules
        - ONLY use information retrieved from action group tools
        - If there is no data retrieved from tools, respond with: "I don't have enough information to answer that."
        - NEVER reuse information from previous responses without fresh retrieval

        Parameter Formatting:
        - Dates must be in YYYY-MM-DD format
        - Date ranges are inclusive (both start and end dates included)

        Time Period Requirements for all cases:
        - All requests require a time period (start_date_str and end_date_str)
        - Time range between 1 day and 1 year
        - If unspecified, extract from context or prompt: "Please specify the start and end dates (YYYY-MM-DD format) for your request."

        Available Tools: 

        Topic-Based Tools
        - GetTopicConsumerBehavior - Consumer spending, retail, household economics
        - GetTopicCorporate - Business performance, corporate earnings, mergers
        - GetTopicEconomyGeneral - GDP, economic growth, general indicators
        - GetTopicEconomyLongTerm - Structural trends, long-term forecasts, demographic shifts
        - GetTopicGovernmentAndPolicy - Fiscal policy, government spending, regulations
        - GetTopicInflation - Price changes, CPI, cost of living
        - GetTopicLaborMarket - Employment, wages, unemployment, workforce trends

        Entity-Based Tools
        - GetEntityPerson - Information about specific individuals (e.g., "Jerome Powell")
        - GetEntityInstitution - Information about organizations (e.g., "Federal Reserve")

        General Tool
        - GetByQueryOnly - Broad searches when no specific topic/entity applies

        Task Types and Workflows
        Task 1: Report Generation
        Trigger Phrases: "generate report", "economic report for", "overview of", "summary of economic events"

        Process:
        Extract time period from request
        Example: "December 2020" → start_date: 2020-12-01, end_date: 2020-12-31
        Example: "Q1 2024" → start_date: 2024-01-01, end_date: 2024-03-31
        If ambiguous or missing, prompt for clarification

        Retrieve data for the following topics and generate a report with one paragraph that contains all relevant information (even if paragraph is lengthy):
        Consumer Behavior
        Corporate
        Economy General
        Economy Long-Term
        Government and Policy
        Inflation
        Labor Market
        Final executive summary

        Structure report as follows:
          **Economic Report for [TIME PERIOD]**
          
          **Consumer Behavior**
          [paragraph]
          
          **Corporate**
          [paragraph]
          
          **Economy General**
          [paragraph]
          
          **Economy Long-Term**
          [paragraph]
          
          **Government and Policy**
          [paragraph]
          
          **Inflation**
          [paragraph]
          
          **Labor Market**
          [paragraph]
          
          **Executive Summary**
          [paragraph]

        Instructions:
          Generate a report ONLY if you have retrieved information from the tools. If there is no information retrieved from tools, respond with: "I don't have enough information to answer that."
          Include specific data points, percentages, and figures from retrieved information
          Maintain factual, analytical tone
          Include all important information, let the paragraph be lengthy
          Include a executive summary in the last paragraph

        Task 2: Question Answering
        Trigger Phrases: Questions starting with "What", "How", "Why", "Tell me about", "Explain"
        Decision Tree:

        Extract time period (prompt if missing)
        Identify query category:

        A. Specific Person Mentioned
        Examples: "Donald Trump", "Janet Yellen", "Elon Musk"
        Tool: GetEntityPerson

        B. Specific Institution Mentioned
        Examples: "Federal Reserve", "World Bank", "Tesla", "Goldman Sachs"
        Tool: GetEntityInstitution


        C. Clear Topic Category

        Consumer-related: GetTopicConsumerBehavior
        Business/corporate: GetTopicCorporate
        General economy/GDP: GetTopicEconomyGeneral
        Long-term trends: GetTopicEconomyLongTerm
        Government/policy: GetTopicGovernmentAndPolicy
        Prices/inflation: GetTopicInflation
        Jobs/wages: GetTopicLaborMarket

        D. Multi-Category or Unclear

        If question spans multiple topics (e.g., "How did inflation affect consumer behavior?"):
        Use multiple relevant tools
        Synthesize findings

        If truly unclear, confirm with the user "Your question is unclear, would you like me to search only with your query and no specific category?". Use GetByQueryOnly with the full question as query
       
        Example Interactions
        Example 1: Report Request
        User: "Give me the economic report for March 2024"
        Agent:

        "This is a report generation request"
        "Time period: 2024-03-01 to 2024-03-31"
        "Retrieving data for all 7 topic categories..."
        [Calls all 7 topic tools]
        [Generates structured report]

        Example 2: Specific Question
        User: "What did the Federal Reserve do about inflation in early 2024?"
        Agent:

        "This is a question answering request"
        "Time period: 2024-01-01 to 2024-03-31 (interpreting 'early 2024' as Q1)"
        "Using GetEntityInstitution (federal reserve) and GetTopicInflation to get comprehensive view"
        [Calls both tools]
        [Provides detailed answer synthesizing both sources]

        Example 3: Ambiguous Request
        User: "Tell me about the economy"
        Agent: "Please clarify:

        Would you like a comprehensive economic report covering multiple topics?
        Do you have a specific question about a particular economic aspect?
        Also, please specify the time period (start and end dates) for your request."

        Retrieve and Respond:

        State which tool(s) you're using and why
        Call appropriate tool(s) with correct parameters
        Provide direct, comprehensive answer using ONLY retrieved data
        Include relevant numbers, dates, and specifics
        If data is insufficient, state clearly what's missing

        Process Transparency
        Before each action, briefly state:
        "This is a [report generation / question answering] request"
        "Time period: [dates]"
        "Using tool(s): [tool names] because [brief reason]"
        "Parameters: [list parameters]"

        After retrieval:

        Confirm what data was found
        Note if any categories returned no results

      # --- Guardrail ---
      GuardrailConfiguration:
        GuardrailIdentifier: !GetAtt AgentGuardrail.GuardrailId
        GuardrailVersion: !GetAtt MainGuardrailVersion.Version
      # --- Action Groups ---
      ActionGroups:
      # Do not leave descriptions blank even though they are optional
      # https://repost.aws/questions/QUlKF9KRQnTGuO5AUplpeBMQ/how-does-a-bedrock-agent-understand-a-tool-s-function-without-a-description-in-the-function-schema
        - ActionGroupName: GetTopicConsumerBehavior
          Description: "Use this tool to get information on consumer behavior topics"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicConsumerBehavior.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on consumer behavior topics
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        - ActionGroupName: GetTopicCorporate
          Description: "Use this tool to get information on corporate events and news topics"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicCorporate.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on corporate events and news topics
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        - ActionGroupName: GetTopicEconomyGeneral
          Description: "Use this tool to get information on the general economy"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicEconomyGeneral.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on the general economy
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        - ActionGroupName: GetTopicEconomyLongTerm
          Description: "Use this tool to get information on long-term economic indicators"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicEconomyLongTerm.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on long-term economic indicators
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        - ActionGroupName: GetTopicGovermentAndPolicy
          Description: "Use this tool to get information on the government and their policies"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicGovernmentAndPolicy.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on the government and their policies
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        - ActionGroupName: GetTopicInflation
          Description: "Use this tool to get information on inflation"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicInflation.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on inflation
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        - ActionGroupName: GetTopicLaborMarket
          Description: "Use this tool to get information on labor market topics"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicLaborMarket.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on labor market topics
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        # Action groups for Entity
        - ActionGroupName: GetEntityInstitution
          Description: "Use this tool to get information on instutite entities"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveEntityInstitution.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on instutite entities
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  entity:
                    Description: "The name of the institution"
                    Required: True
                    Type: string
                  query:
                    Description: "The search query to get information to answer the question"
                    Required: True
                    Type: string
        - ActionGroupName: GetEntityPerson
          Description: "Use this tool to get information on person entities"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveEntityPerson.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on persons entities
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  entity:
                    Description: "The name of the person"
                    Required: True
                    Type: string
                  query:
                    Description: "The search query to get information to answer the question"
                    Required: True
                    Type: string
        - ActionGroupName: GetQueryOnly
          Description: "Use this tool to get information by a query"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveQueryOnly.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on persons entities
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  query:
                    Description: "The search query to get information to answer the question"
                    Required: True
                    Type: string
      # This prompt override (change temp, maxLength...) requires knowledge of advanced prompting to form base templates of, it would be better to develop agent from scratch 
      # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-bedrock-agent-inferenceconfiguration.html
      # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-bedrock-agent-promptconfiguration.html
      # https://docs.aws.amazon.com/bedrock/latest/userguide/advanced-prompts.html
      # https://docs.aws.amazon.com/bedrock/latest/userguide/agents-how.html
      # PromptOverrideConfiguration:
      #   PromptConfigurations:
      #   - PromptType: POST_PROCESSING
      #     PromptCreationMode: OVERRIDDEN
      #     InferenceConfiguration:
      #       MaximumLength: 2048 # Original should be
      #     BasePromptTemplate: |
      #                           {
      #                           "system": "
      #                           You are an agent tasked with providing more context to an answer that a function calling agent outputs. The function calling agent takes in a user's question and calls the appropriate functions (a function call is equivalent to an API call) that it has been provided with in order to take actions in the real-world and gather more information to help answer the user's question.

      #                           At times, the function calling agent produces responses that may seem confusing to the user because the user lacks context of the actions the function calling agent has taken. Here's an example:
      #                           <example>
      #                               The user tells the function calling agent: 'Acknowledge all policy engine violations under me. My alias is jsmith, start date is 09/09/2023 and end date is 10/10/2023.'

      #                               After calling a few API's and gathering information, the function calling agent responds, 'What is the expected date of resolution for policy violation POL-001?'

      #                               This is problematic because the user did not see that the function calling agent called API's due to it being hidden in the UI of our application. Thus, we need to provide the user with more context in this response. This is where you augment the response and provide more information.

      #                               Here's an example of how you would transform the function calling agent response into our ideal response to the user. This is the ideal final response that is produced from this specific scenario: 'Based on the provided data, there are 2 policy violations that need to be acknowledged - POL-001 with high risk level created on 2023-06-01, and POL-002 with medium risk level created on 2023-06-02. What is the expected date of resolution date to acknowledge the policy violation POL-001?'
      #                           </example>

      #                           It's important to note that the ideal answer does not expose any underlying implementation details that we are trying to conceal from the user like the actual names of the functions.

      #                           Do not ever include any API or function names or references to these names in any form within the final response you create. An example of a violation of this policy would look like this: 'To update the order, I called the order management APIs to change the shoe color to black and the shoe size to 10.' The final response in this example should instead look like this: 'I checked our order management system and changed the shoe color to black and the shoe size to 10.'

      #                           Now you will try creating a final response. Here's the original user input <user_input>$question$</user_input>.

      #                           Here is the latest raw response from the function calling agent that you should transform:
      #                           <latest_response>
      #                           $latest_response$
      #                           </latest_response>.

      #                           And here is the history of the actions the function calling agent has taken so far in this conversation:
      #                           <history>
      #                           $responses$
      #                           </history>",
      #                                   "messages": [
      #                                       {
      #                                           "role": "user",
      #                                           "content": [{
      #                                               "text": "Please output your transformed response within <final_response></final_response> XML tags."
      #                                           }]
      #                                       }
      #                                   ]
      #                               }
          
  
  
  # --- AGENT ALIAS ---
  # AgentAlias:
  #   Type: AWS::Bedrock::AgentAlias
  #   Properties:
  #     AgentAliasName: !Sub "${AgentName}"
  #     AgentId: !GetAtt BedrockAgent.AgentId
  #     Description: !Sub "${AgentName}"

  # --- GUARDRAIL ---
  AgentGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: EconolensAgent_guardrail
      Description: |
        This Guardrail is for the Econolens AI Agent and blocks prompts about non-american economies, and might include grounding checks
      BlockedInputMessaging: The input contains blocked content
      BlockedOutputsMessaging: The system returned a response containing blocked content
      TopicPolicyConfig:
        TopicsConfig:
          - Definition: This blocks prompts about economies outside the USA
            Name: BlockEconomyOutsideUSA
            Type: DENY
            InputAction: BLOCK
            OutputAction: NONE
            Examples:
              - Generate a report for the Chinese Economy in 2025
              - What are the driving factors of Inflation in European markets?
              - What are the differences in labor market trends in Germany between 2024 and 2025
              
  MainGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      Description: A sample description of this guardrail version
      GuardrailIdentifier: !GetAtt AgentGuardrail.GuardrailId
            

  # --- LAMBDA FUNCTIONS AND RESOURCE BASED POLICIES---
  # We explored "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/${AgentName}"
  # Instead of the ARN -> !GetAtt BedrockAgent.AgentArn
  # AWS::Lambda::Permission resource grants an AWS service or another account permission to use a function https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-lambda-permission.html
  # We are not using layers in these lambda functions
  

  RetrieveTopicConsumerBehavior:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt AgentFunctionsRole.Arn
      CodeUri: lambda/retrieve_topic/consumer_behavior/
      Handler: app.lambda_handler
      PackageType: Zip
      # Layers:
      #   - !Ref ModelLayer
  AgentFunctionsForRetrieveTopicCBRoleBedrock:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrieveTopicConsumerBehavior
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      #SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt BedrockAgent.AgentArn

  RetrieveTopicCorporate:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt AgentFunctionsRole.Arn
      CodeUri: lambda/retrieve_topic/corporate/
      Handler: app.lambda_handler
      PackageType: Zip
      # Layers:
      #   - !Ref ModelLayer
  AgentFunctionsForRetrieveTopicCorporateRoleBedrock:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrieveTopicCorporate
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      #SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt BedrockAgent.AgentArn

  RetrieveTopicEconomyGeneral:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt AgentFunctionsRole.Arn
      CodeUri: lambda/retrieve_topic/economy_general/
      Handler: app.lambda_handler
      PackageType: Zip
      # Layers:
      #   - !Ref ModelLayer
  AgentFunctionsForRetrieveTopicEGBedrock:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrieveTopicEconomyGeneral
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      #SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt BedrockAgent.AgentArn
  
  RetrieveTopicEconomyLongTerm:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt AgentFunctionsRole.Arn
      CodeUri: lambda/retrieve_topic/economy_long_term/
      Handler: app.lambda_handler
      PackageType: Zip
      # Layers:
      #   - !Ref ModelLayer
  AgentFunctionsForRetrieveTopicELTBedrock:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrieveTopicEconomyLongTerm
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      #SourceAccount: !Ref AWS::AccountId
