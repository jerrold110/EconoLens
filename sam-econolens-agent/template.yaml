AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sam-econolens-agent
  AI components of the Econolens project consisting of agent, action groups, lambdas, guardrail, agent alias

Parameters:
  AgentName:
    Type: String
    Default: EconolensAgent
    Description: Name for the Bedrock Agent

Globals:
  Function:
    Timeout: 300 # seconds
    MemorySize: 512 # MB
    Tracing: Active
    Runtime: python3.11
    Architectures:
      - x86_64
    Environment:
      Variables:
        BEDROCK_KNOWLEDGE_BASE_ID: 7TJCJ0AADQ # Bedrock KB ID, switches every time I restart the KB
        RETRIEVE_CHUNK_PER_DAY_COUNT: 5
        RERANK_CHUNK_COUNT: 30
        POWERTOOLS_METRICS_NAMESPACE: bedrock-agent-demo
        POWERTOOLS_SERVICE_NAME: bedrock-agent-demo
# https://repost.aws/questions/QUwyrhlEugTH-DV_dH5lG3Ag/issue-with-bedrock-agents-and-lambda-function-model-timeout-error
Resources:
  # --- BEDROCK AGENT ---
  BedrockAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Ref AgentName # this is working
      AgentResourceRoleArn: !GetAtt BedrockAgentExecutionRole.Arn
      Description: "Agent for economic reporting and question answering. Required: Time-period dates (inclusive). Optional: Topic, entity keyword"
      # https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html
      FoundationModel: amazon.nova-pro-v1:0
      # This requires knowledge of advanced prompting to form base templates of, it would be better to develop agent from scratch 
      # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-bedrock-agent-inferenceconfiguration.html
      # https://docs.aws.amazon.com/bedrock/latest/userguide/advanced-prompts.html
      # PromptOverrideConfiguration:
      #   PromptConfigurations:
      #     # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-bedrock-agent-promptconfiguration.html
      #     # PRE_PROCESSING | ORCHESTRATION | POST_PROCESSING | ROUTING_CLASSIFIER | MEMORY_SUMMARIZATION | KNOWLEDGE_BASE_RESPONSE_GENERATION
      #     # https://docs.aws.amazon.com/bedrock/latest/userguide/agents-how.html
      #   - PromptType: POST_PROCESSING
      #     PromptCreationMode: DEFAULT
      
      
      Instruction: |
        You are an economic analyst that generates economic reports or answers specific questions about economic events and their effect on the economy. You have access to a knowledge which you access through action group tools that has up-to-date data until the present day in the form of news articles, so you do not need to be trained with the data you will use to augment your response. You must answer ONLY using information retrieved from the action group tools. If the retrieved data does not contain any information, reply:  "I don't have enough information to answer that." Do NOT guess, infer, or invent details, do not use details from the previous response as facts to respond with.

        Every report generation request requires the user to specify a time-period over which economic events took place but the user does not have to explicitly state so, the start and end date are inclusive. For example, if the user says "Give me the economic report for December 2020" , the time-period is the whole month of December in the year 2020, enter 2020-12-01 as start_date_str and 2020-12-31 and end_date_str. These time periods can be as small as one day (the start and end date are the same), or as long as one year.

        Questions asked require either a specic time-period or a specific entity which can be a person or an institution. If no person or entity is specified (eg: "Tell me about events that have negative effects on the economy") You can use the action group If they are about a specific person (eg: Trump, Powell) or a specific institution (eg: Federal Reserve, White house) you c

        These are the instructions for the tasks you can perform:
        1. REPORT GENERATION: When asked to generate a report or provide a comprehensive overview:
          - Extract the time-period and extract start_date_str and end_date_str parameters from the prompt. Prompt the user if a time-period is not specified
          - Get data for each of these topics and write a paragraph for each one: consumer behavior, corporate, economy general, economy long term, goverment and policy, inflation, labor market
          - Summarise the retrieved data, include all relevant details from the retrieved data even if lengthy
          - Finally include a paragraph summarising the report
          - Place a title above each paragraph consisting of its topic in bold letters
          - The main title of the report is "Economic report for ...", where ... is the time period for which the report covers in bold letters

        2. QUESTION ANSWERING: When asked a specific question:
          - Extract the time-period and extract start_date_str and end_date_str parameters from the prompt. Prompt the user if a time-period is not specified
          - Decide what tool to use based on the user's prompt
            - If the question is related to an entity (ie: trump, powell, white house) use the tool GetEntityByPerson
          - Use a tool that gets data for a certain topic if the question is related to an economic topic (ie: inflation, labor_market, economy_long_term)
          - Provide a direct, concise answer based on the retrieved data containing the main points

        You have access to the following tools:
          GetTopicConsumerBehavior: this is used for retrieving information on consumer behavior topics
          GetTopicCorporate: this is used for retrieving information on corporate topics
          GetTopicEconomyGeneral: this is used for retrieving information on the general economy
          GetTopicEconomyLongTerm: this is used for retrieving information on long-term economic indicators
          GetTopicGovermentAndPolicy: this is used for retrieving information on the government and their policies
          GetTopicInflation: this is used for retrieving information on inflation
          GetTopicLaborMarket: this is used for retrieving information on labor market topics


        Always follow these instructions step-by-step:
        - First, determine if this is a request for a report or to answer a specific question 
        - At each stage, state the function you are going to call and the parameters you will pass
        - Then call the appropriate function(s)
        - List the exact pieces of retrieved context that are relevant to the request. Determine if you have any retrieved context to provide a response.
        - Finally, if you have evidence, even a little, using ONLY the retrieved context, format your response appropriately
      # --- Action Groups ---
      ActionGroups:
      # Do not leave descriptions blank even though they are optional
      # https://repost.aws/questions/QUlKF9KRQnTGuO5AUplpeBMQ/how-does-a-bedrock-agent-understand-a-tool-s-function-without-a-description-in-the-function-schema
        - ActionGroupName: GetTopicConsumerBehavior
          Description: "Use this tool to get information on consumer behavior topics"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicConsumerBehavior.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on consumer behavior topics
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        - ActionGroupName: GetTopicCorporate
          Description: "Use this tool to get information on corporate events and news topics"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicCorporate.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on corporate events and news topics
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        - ActionGroupName: GetTopicEconomyGeneral
          Description: "Use this tool to get information on the general economy"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicEconomyGeneral.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on the general economy
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        - ActionGroupName: GetTopicEconomyLongTerm
          Description: "Use this tool to get information on long-term economic indicators"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicEconomyLongTerm.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on long-term economic indicators
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        - ActionGroupName: GetTopicGovermentAndPolicy
          Description: "Use this tool to get information on the government and their policies"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicGovernmentAndPolicy.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on the government and their policies
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        - ActionGroupName: GetTopicInflation
          Description: "Use this tool to get information on inflation"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicInflation.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on inflation
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
        - ActionGroupName: GetTopicLaborMarket
          Description: "Use this tool to get information on labor market topics"
          ActionGroupExecutor:
            Lambda: !GetAtt RetrieveTopicLaborMarket.Arn
          ActionGroupState: ENABLED
          FunctionSchema:
            Functions:
              - Name: GetInformation
                Description: |
                  Get information on labor market topics
                Parameters:
                  end_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string
                  start_date_str:
                    Description: "The end date of the time-period"
                    Required: True
                    Type: string

  # --- GUARDRAIL ---
  AgentGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: Econolens_guardrail
      Description: Guardrails for contextual grounding check
      BlockedInputMessaging: The input contains blocked content
      BlockedOutputsMessaging: The system returned an invalid response
      TopicPolicyConfig:
        TopicsConfig:
          - Name: BlockFinancialAdvice
            Type: DENY
            Definition: This policy blocks financial advice
            Examples:
              - You should invest now because shares because economic conditions look good 
              - You should not invest in Amazon shares because investors are betting on AI

  # --- LAMBDA FUNCTIONS AND RESOURCE BASED POLICIES---
  # We explored "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/${AgentName}"
  # Instead of the ARN -> !GetAtt BedrockAgent.AgentArn
  # AWS::Lambda::Permission resource grants an AWS service or another account permission to use a function https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-lambda-permission.html
  # We are not using layers in these lambda functions
  

  RetrieveTopicConsumerBehavior:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt AgentFunctionsRole.Arn
      CodeUri: lambda/retrieve_topic/consumer_behavior/
      Handler: app.lambda_handler
      PackageType: Zip
      # Layers:
      #   - !Ref ModelLayer
  AgentFunctionsForRetrieveTopicCBRoleBedrock:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrieveTopicConsumerBehavior
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      #SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt BedrockAgent.AgentArn

  RetrieveTopicCorporate:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt AgentFunctionsRole.Arn
      CodeUri: lambda/retrieve_topic/corporate/
      Handler: app.lambda_handler
      PackageType: Zip
      # Layers:
      #   - !Ref ModelLayer
  AgentFunctionsForRetrieveTopicCorporateRoleBedrock:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrieveTopicCorporate
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      #SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt BedrockAgent.AgentArn

  RetrieveTopicEconomyGeneral:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt AgentFunctionsRole.Arn
      CodeUri: lambda/retrieve_topic/economy_general/
      Handler: app.lambda_handler
      PackageType: Zip
      # Layers:
      #   - !Ref ModelLayer
  AgentFunctionsForRetrieveTopicEGBedrock:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrieveTopicEconomyGeneral
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      #SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt BedrockAgent.AgentArn
  
  RetrieveTopicEconomyLongTerm:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt AgentFunctionsRole.Arn
      CodeUri: lambda/retrieve_topic/economy_long_term/
      Handler: app.lambda_handler
      PackageType: Zip
      # Layers:
      #   - !Ref ModelLayer
  AgentFunctionsForRetrieveTopicELTBedrock:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrieveTopicEconomyLongTerm
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      #SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt BedrockAgent.AgentArn

  RetrieveTopicGovernmentAndPolicy:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt AgentFunctionsRole.Arn
      CodeUri: lambda/retrieve_topic/government_and_policy/
      Handler: app.lambda_handler
      PackageType: Zip
      # Layers:
      #   - !Ref ModelLayer
  AgentFunctionsForRetrieveTopicGAPBedrock:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrieveTopicGovernmentAndPolicy
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      #SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt BedrockAgent.AgentArn

  RetrieveTopicInflation:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt AgentFunctionsRole.Arn
      CodeUri: lambda/retrieve_topic/inflation/
      Handler: app.lambda_handler
      PackageType: Zip
      # Layers:
      #   - !Ref ModelLayer
  AgentFunctionsForRetrieveTopicInflationBedrock:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrieveTopicInflation
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      #SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt BedrockAgent.AgentArn
  
  RetrieveTopicLaborMarket:
    Type: AWS::Serverless::Function
    Properties:
      Role: !GetAtt AgentFunctionsRole.Arn
      CodeUri: lambda/retrieve_topic/labor_market/
      Handler: app.lambda_handler
      PackageType: Zip
      # Layers:
      #   - !Ref ModelLayer
  AgentFunctionsForRetrieveTopLMRoleBedrock:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrieveTopicLaborMarket
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      #SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt BedrockAgent.AgentArn

  # --- IAM ROLES ---
  # Principal, who is allowed to assume the role
  # Resource, specific resource(s) the role (role actions) applies to
  AgentFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: A role for Agent Lambda functions to assume
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
            #Resource: !GetAtt BedrockAgent.AgentArn
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess

  BedrockAgentExecutionRole:
    # Agent does not need to access Bedrock KB directly, only action groups
    Type: AWS::IAM::Role
    Properties:
      Description: A role for Agent to assume
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        # Theoretically: This Resource Policy allows bedrock to invoke the lambdas listed, not necessary, but more secure
        # Attach individual lambdas Arns
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                - !GetAtt RetrieveTopicCorporate.Arn
        - PolicyName: BedrockModelAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:ApplyGuardrail"
                  - "bedrock:List*"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "bedrock:GetAgentVersion"
                  - "bedrock:GetAgentAlias"
                  - "bedrock:GetAgentMemory"
                  - "bedrock:GetAgent"
                  - "bedrock:GetAgentActionGroup"
                  - "bedrock:GetAgentKnowledgeBase"
                  - "bedrock:ListAgentVersions"
                  - "bedrock:ListAgentActionGroups"
                  - "bedrock:ListAgentKnowledgeBases"
                  - "bedrock:ListAgentAliases"
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/${AgentName}" # this has to be used instead of !GetAtt BedrockAgent.AgentArn
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                  - "bedrock:InvokeModelWithResponseStream"
                  - "bedrock:GetInferenceProfile"
                  - "bedrock:GetFoundationModel"
                Resource: "*" # can place specific model arn here
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "bedrock:GetGuardrail"
                  - "bedrock:ApplyGuardrail"
                  - "bedrock:ListGuardrails"
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/${AgentName}" # this has to be used instead of !GetAtt BedrockAgent.AgentArn
